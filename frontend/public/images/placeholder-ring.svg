<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="ringGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7F1E8"/>
      <stop offset="100%" stop-color="#E8DEC8"/>
    </radialGradient>
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD5AC"/>
      <stop offset="40%" stop-color="#B08D57"/>
      <stop offset="70%" stop-color="#8C6E3D"/>
      <stop offset="100%" stop-color="#CFB584"/>
    </linearGradient>
    <linearGradient id="gemFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#EBF4F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#ringGrad)"/>
  <ellipse cx="400" cy="720" rx="220" ry="28" fill="#D3C7B5" opacity="0.3"/>
  
  <!-- Ring Band -->
  <ellipse cx="400" cy="560" rx="150" ry="170" fill="none" stroke="url(#goldBand)" stroke-width="26"/>
  <ellipse cx="400" cy="554" rx="146" ry="164" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>

  <!-- Prongs and Solitaire Diamond -->
  <g transform="translate(400, 370)">
    <!-- Prongs -->
    <line x1="-38" y1="20" x2="-25" y2="-45" stroke="#D1D5DB" stroke-width="7" stroke-linecap="round"/>
    <line x1="38" y1="20" x2="25" y2="-45" stroke="#D1D5DB" stroke-width="7" stroke-linecap="round"/>
    <line x1="-22" y1="30" x2="-8" y2="-52" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="22" y1="30" x2="8" y2="-52" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <!-- Diamond Gemstone Facets -->
    <polygon points="0,-75 55,-35 40,25 -40,25 -55,-35" fill="url(#gemFacet)" stroke="#B0C4DE" stroke-width="1.5"/>
    <polygon points="0,-75 25,-40 -25,-40" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="25,-40 55,-35 25,0 0,-15" fill="#E0F2FE" opacity="0.7"/>
    <polygon points="-25,-40 -55,-35 -25,0 0,-15" fill="#F0F9FF" opacity="0.8"/>
    <polygon points="0,-15 25,0 0,25 -25,0" fill="#FFFFFF" opacity="0.95"/>
    <!-- Sparkle Highlights -->
    <circle cx="0" cy="-75" r="4" fill="#FFFFFF"/>
    <circle cx="28" cy="-10" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>
