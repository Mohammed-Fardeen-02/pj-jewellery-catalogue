services:
  postgres:
    image: postgres:16-alpine
    container_name: pj_jewellery_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pj_jewellery_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pj_jewellery_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pj_jewellery_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: "PJ Jewellery Catalogue API"
      APP_ENV: "development"
      API_V1_PREFIX: "/api/v1"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/pj_jewellery_dev"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-secret-key-change-in-production-min-32-chars}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      FRONTEND_URL: "http://localhost:3000"
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    restart: unless-stopped

volumes:
  postgres_data:
    name: pj_jewellery_postgres_data
