# Alembic configuration for PJ Jewellery Catalogue Backend

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Sys.path prepend
prepend_sys_path = .

# Timezone for revision timestamps (optional)
# timezone = UTC

# Max length of characters for "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be considered as revisions
sourceless = false

# Search for migrations in subdirectories
version_locations = %(here)s/alembic/versions

# Dynamic database URL is populated by env.py from app.core.config.Settings
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/pj_jewellery_dev

[post_write_hooks]
# Hooks executed after generating new revisions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
